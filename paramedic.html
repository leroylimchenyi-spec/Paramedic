<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paramedic Reference</title>
<style>
:root {
  box-sizing: border-box;
  --bg: #f5f7fa; --panel: #ffffff; --text: #1c2430; --muted: #5b6676;
  --accent: #2d5f8b; --accent-soft: #e8eef5; --border: #d9dde3;
  --warn: #8a4b00; --warn-soft: #fff4e5;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1b2029; --text: #e6eaf2; --muted: #9aa4b5;
    --accent: #7fb0d9; --accent-soft: #1f2d3b; --border: #2e333c;
    --warn: #ffb36b; --warn-soft: #3a2a18;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1b2029; --text: #e6eaf2; --muted: #9aa4b5;
  --accent: #7fb0d9; --accent-soft: #1f2d3b; --border: #2e333c;
  --warn: #ffb36b; --warn-soft: #3a2a18;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.55; }
header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 20px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
main { max-width: 900px; margin: 0 auto; padding: 20px; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
.disclaimer { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); border-radius: 6px; padding: 10px 14px; font-size: 0.88rem; margin-bottom: 18px; }
#search { width: 100%; padding: 14px 16px; font-size: 1rem; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
#search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 18px; }
.pill { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 7px 13px; border-radius: 6px; cursor: pointer; font-size: 0.86rem; font-family: inherit; }
.pill[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px; margin-bottom: 14px; }
.card h2 { margin: 4px 0 8px; font-size: 1.1rem; }
.card ol { margin: 6px 0 0 20px; padding: 0; }
.card li { margin-bottom: 6px; }
.card p { margin: 6px 0; }
.tag { font-size: 0.8rem; color: var(--muted); }
.muted { color: var(--muted); font-size: 0.86rem; }
.section-label { font-size: 0.9rem; font-weight: 600; color: var(--muted); margin: 22px 0 8px; }
.related { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.topic-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); margin-bottom: 8px; }
.topic-row button { border: none; background: none; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; text-align: left; padding: 0; }
.empty { text-align: center; color: var(--muted); padding: 24px 10px; }
.hidden { display: none; }

.guide-open { margin-bottom: 14px; }
.guide { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-bottom: 14px; }
.guide h2 { margin: 0 0 6px; font-size: 1rem; }
.guide .hint { color: var(--muted); font-size: 0.86rem; margin: 0 0 10px; }
.guide .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.guide .opt { border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-family: inherit; }
.guide .opt:hover { border-color: var(--accent); }
.guide .back-link { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; margin-top: 10px; }
.brandbar { display: flex; align-items: center; gap: 12px; }
.brandbar .logo { width: 48px; height: 48px; flex-shrink: 0; }
.brandbar h1, .brandbar p { margin: 0; }
:root { --accent: #1d3fbf; }
:root[data-theme="dark"] { --accent: #6f8bff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #6f8bff; } }
</style>
</head>

      "Ask OPQRST questions and take a full set of vitals.",
      "Let the patient sit in a comfortable position and keep them calm.",
      "Give oxygen only if SpO2 is low or the patient is distressed.",
      "Attach the cardiac monitor and take a 12-lead ECG if your equipment allows.",
      "Establish IV access and give medications according to your protocol.",
      "Watch for rhythm changes, worsening pain, or shock.",
      "Transport promptly to a hospital that treats heart attacks, and give the time symptoms started."
    ] },

  { cat: "Emergencies", title: "Stroke", q: ["stroke symptoms", "face drooping", "slurred speech", "one side weak", "be fast", "numb arm and face", "patient cant speak", "one side of face not moving"],
    a: [
      "Use BE FAST: Balance loss, Eyes (vision changes), Face drooping, Arm weakness, Speech difficulty, Time to act.",
      "Note the exact time symptoms started, since treatment depends on it.",
      "Check blood glucose, because low sugar can mimic a stroke.",
      "Protect the airway and position the patient with the head slightly raised.",
      "Transport to a stroke-capable hospital and give the onset time in your handoff."
    ] },

  { cat: "Emergencies", title: "Allergic reaction or anaphylaxis", q: ["allergic reaction", "anaphylaxis", "throat swelling", "hives and swelling", "bee sting reaction", "when to give epinephrine", "face swelling after eating", "allergy attack"],
    a: [
      "Check the airway first, since throat swelling can close it quickly.",
      "Ask about likely triggers: food, medication, insect stings, latex.",
      "Give epinephrine according to your protocol for breathing difficulty, face or throat swelling, or low blood pressure.",
      "Give oxygen and monitor breathing, pulse, and blood pressure.",
      "Transport even if symptoms improve, since they can return."
    ] },

  { cat: "Emergencies", title: "Asthma or breathing difficulty", q: ["asthma attack", "wheezing", "short of breath", "cant breathe well", "copd flare", "shortness of breath", "patient struggling to breathe", "inhaler not working"],
    a: [
      "Sit the patient upright and keep them calm, since panic makes breathing harder.",
      "Ask whether they have an inhaler and whether it has helped.",
      "Give oxygen and bronchodilators according to your protocol.",
      "Monitor SpO2, respiratory rate, and whether they can speak in full sentences.",
      "Watch for tiredness, confusion, or drowsiness, which mean the patient is tiring out.",
      "Transport and report their response to treatment."
    ] },

  { cat: "Emergencies", title: "Low blood sugar", q: ["low blood sugar", "hypoglycemia", "patient confused and diabetic", "insulin reaction", "diabetic shaking and sweating", "sugar is low", "diabetic emergency"],
    a: [
      "Check blood glucose with a glucometer as soon as you can.",
      "If the patient is awake and can swallow safely, give fast sugar according to your protocol, then recheck.",
      "If the patient cannot swallow or is unresponsive, follow your protocol for IV glucose or glucagon.",
      "Recheck glucose after treatment and report the results."
    ] },

  { cat: "Emergencies", title: "High blood sugar", q: ["high blood sugar", "hyperglycemia", "diabetic ketoacidosis", "dka", "very thirsty and peeing a lot", "fruity breath", "deep fast breathing diabetic"],
    a: [
      "Expect thirst, frequent urination, nausea, vomiting, weakness, and confusion.",
      "Look for deep, rapid breathing and fruity-smelling breath, which can mean ketoacidosis.",
      "Check blood glucose and vitals.",
      "Give fluids according to your protocol and monitor closely.",
      "Transport, since this condition can worsen quickly."
    ] },

  { cat: "Emergencies", title: "Seizure", q: ["seizure", "patient is fitting", "convulsing", "shaking uncontrollably", "epileptic", "seizure what to do", "person having a fit"],
    a: [
      "Protect the patient from injury by moving objects away and cushioning the head.",
      "Do not restrain the patient or put anything in their mouth.",
      "Time the seizure and note what it looked like.",
      "After it stops, place the patient in the recovery position and check breathing.",
      "Check blood glucose.",
      "Transport if the seizure is long, repeats, or the patient does not return to normal."
    ] },

  { cat: "Emergencies", title: "Fainting (syncope)", q: ["fainted", "passed out", "blacked out", "dizzy and collapsed", "syncope", "patient fainted at work", "lightheaded and fell"],
    a: [
      "Look for the cause: heart rhythm, blood sugar, dehydration, pregnancy, and injuries from the fall.",
      "Lay the patient flat and raise the legs if they are not injured.",
      "Take vitals and watch for them fainting again.",
      "Transport if there is chest pain, injury, shortness of breath, or no clear cause."
    ] },

  { cat: "Emergencies", title: "Overdose or poisoning", q: ["overdose", "poisoning", "took too many pills", "swallowed something toxic", "drug overdose", "ingested poison", "poisoned"],
    a: [
      "Check scene safety, then find out what was taken, how much, and when if possible.",
      "Assess airway, breathing, and circulation first.",
      "Support vital signs and give treatment according to your protocol.",
      "Bring any containers or packaging to the hospital.",
      "Follow your server's rules on roleplay drug content."
    ] },

  { cat: "Emergencies", title: "Heat stroke", q: ["heat stroke", "overheated", "heat exhaustion", "patient too hot", "very hot skin confused", "heat illness"],
    a: [
      "Move the patient to shade or a cool place.",
      "Cool them quickly with cold packs or cool water according to protocol.",
      "Heat stroke causes confusion or collapse. Treat as an emergency even if the patient seems to improve.",
      "Give oxygen if needed, monitor vitals, and transport."
    ] },

  { cat: "Emergencies", title: "Hypothermia", q: ["hypothermia", "freezing patient", "frostbite", "patient too cold", "found in the snow", "cold exposure"],
    a: [
      "Move the patient to shelter and remove wet clothing.",
      "Insulate with blankets and handle gently, since rough movement can trigger dangerous heart rhythms.",
      "Check mental status, temperature, and vitals.",
      "For frostbite, protect frozen areas from refreezing and do not rub them.",
      "Transport if the patient is confused, unresponsive, or not improving."
    ] },

  { cat: "Emergencies", title: "Choking", q: ["choking", "cant breathe food stuck", "airway blocked by food", "foreign body in throat", "choking adult", "choking baby", "heimlich"],
    a: [
      "Ask if they can speak or cough. If they can, encourage coughing.",
      "If they cannot cough, speak, or breathe, give back blows and abdominal thrusts according to your protocol.",
      "If they become unresponsive, start CPR and check the mouth for an object before each set of breaths.",
      "Transport after the airway is clear, since complications can follow."
    ] },

  { cat: "Emergencies", title: "Drowning", q: ["drowning", "pulled from water", "near drowning", "person in pool not breathing", "water in lungs"],
    a: [
      "Make sure the scene is safe for rescuers before entering the water.",
      "Remove the patient from the water carefully, keeping the neck protected if a diving injury is possible.",
      "Start rescue breaths or CPR, since breathing problems are the main danger.",
      "Give oxygen and monitor. Transport even if the patient seems recovered, because they can deteriorate later."
    ] },

  { cat: "Emergencies", title: "Abdominal pain", q: ["stomach pain", "abdominal pain", "belly hurts", "appendicitis", "vomiting blood", "stomach cramps", "pain in belly"],
    a: [
      "Use OPQRST and ask about nausea, vomiting, bowel movements, and last meal.",
      "Check for guarding or rigidity, and look for blood in vomit or stool.",
      "Take vitals. Check glucose if the patient is confused or diabetic.",
      "Keep the patient comfortable and avoid giving food or drink.",
      "Transport, and report the location and character of the pain."
    ] },

  { cat: "Emergencies", title: "Sepsis (severe infection)", q: ["sepsis", "infection spreading", "fever and confused", "high fever and fast heart rate", "patient very sick with infection"],
    a: [
      "Look for fever or low temperature, a fast heart rate, fast breathing, and confusion.",
      "Ask about recent infection, wounds, or illness.",
      "Give oxygen if needed, support blood pressure, and follow your protocol for IV fluids.",
      "Transport quickly, since sepsis can worsen fast."
    ] },

  { cat: "Emergencies", title: "Pregnancy and childbirth", q: ["pregnant", "childbirth", "labour", "baby is coming", "delivering baby", "bleeding while pregnant", "contractions"],
    a: [
      "Ask how far along the pregnancy is and how far apart the contractions are.",
      "If the baby is coming, prepare for delivery: support the head and keep the baby warm.",
      "Keep the mother positioned comfortably and monitor her vitals.",
      "Bleeding during pregnancy is always an emergency. Treat for shock and transport.",
      "After delivery, dry and warm the baby, check breathing, and transport both patients."
    ] },

  { cat: "Emergencies", title: "Unconscious, cause unknown", q: ["unconscious", "found unresponsive", "wont wake up", "passed out no reason", "unknown medical", "altered mental status"],
    a: [
      "Check airway, breathing, and circulation first.",
      "Check blood glucose, since it is a common and easily missed cause.",
      "Look for clues: medical alert bracelets, medication packaging, drugs or alcohol, and injuries.",
      "Use GCS to track the patient, and place them in the recovery position if the airway is safe.",
      "Transport and report what you found."
    ] },

  { cat: "Emergencies", title: "Behavioural or psychiatric emergency", q: ["person is agitated", "suicidal", "mental health crisis", "person threatening themselves", "psychiatric emergency", "person hearing voices"],
    a: [
      "Make sure the scene is safe for you and the patient. Ask for police support if there is a threat.",
      "Speak calmly, keep your distance, and explain what you are doing.",
      "Do not restrain unless you are trained and it is required by protocol.",
      "Check for medical causes such as drugs, low blood sugar, or head injury.",
      "Transport according to your server's rules for mental health calls."
    ] },

  { cat: "Emergencies", title: "Severe headache", q: ["worst headache", "bad headache", "headache and vomiting", "sudden headache", "headache with stiff neck"],
    a: [
      "Ask whether the headache came on suddenly and whether it is the worst they have had.",
      "Check neurological signs: speech, vision, weakness, and GCS.",
      "Check blood pressure and blood glucose.",
      "Transport if the headache is sudden, severe, or comes with neurological changes."
    ] },

  // ================= INJURIES =================
  { cat: "Injuries", title: "Severe bleeding", q: ["bleeding", "severe bleeding", "stab wound", "gunshot wound", "shot", "blood loss", "how to use tourniquet", "bleeding from leg", "cut artery", "hemorrhage", "stabbed"],
    a: [
      "Apply firm direct pressure with a dressing and keep pressing.",
      "Use a pressure dressing or hemostatic gauze for deep wounds, and pack the wound if your protocol says so.",
      "If bleeding continues on a limb, apply a tourniquet above the wound and tighten until the bleeding stops. Note the time.",
      "Check for shock: pale or cool skin, fast pulse, low blood pressure, or confusion.",
      "Keep the patient warm and transport quickly."
    ] },

  { cat: "Injuries", title: "Gunshot wound", q: ["gunshot", "shot in the chest", "shot in leg", "gsw", "bullet wound", "shot in stomach"],
    a: [
      "Make sure the scene is safe and law enforcement has cleared any threat.",
      "Control bleeding first, using direct pressure, a tourniquet on limbs, or packing and pressure for a torso wound.",
      "Check for an exit wound and for injuries you cannot see, such as internal bleeding.",
      "Assess airway, breathing, and circulation, and treat for shock.",
      "Transport quickly to a trauma hospital and report the mechanism and wound locations."
    ] },

  { cat: "Injuries", title: "Stab wound", q: ["stabbed", "stab wound", "knife wound", "impaled object", "stabbed in chest", "stabbed in stomach"],
    a: [
      "Check scene safety and leave an object in place if it is impaling a body part, unless it blocks the airway.",
      "Stabilise the object with bulky dressings so it does not move.",
      "Control bleeding around the wound, not directly on the object.",
      "Watch for signs of internal injury and shock.",
      "Transport quickly and report the object and wound location."
    ] },

  { cat: "Injuries", title: "Burns", q: ["burn", "burns", "fire burns", "scald", "chemical burn", "smoke inhalation", "hot liquid burn", "burnt skin"],
    a: [
      "Make sure the scene is safe and the burning has stopped.",
      "Remove jewellery and loose clothing near the burn, but do not pull stuck clothing away.",
      "Cool the burn with cool running water if appropriate, then cover with a dry sterile dressing.",
      "Estimate the percentage of the body burned to help decide transport.",
      "Watch for inhalation injury: soot around the mouth, hoarse voice, or singed hair. Give oxygen and transport."
    ] },

  { cat: "Injuries", title: "Fracture (broken bone)", q: ["broken bone", "fracture", "broken arm", "broken leg", "splint", "bone sticking out", "dislocated shoulder", "how to splint"],
    a: [
      "Check the pulse, sensation, and movement below the injury before splinting.",
      "Immobilise the joint above and below the injury, and support the limb in the position you find it.",
      "Recheck pulse, sensation, and movement after splinting.",
      "For an open fracture, cover the wound with a sterile dressing and control bleeding without pushing the bone back in.",
      "Transport and report the neurovascular status."
    ] },

  { cat: "Injuries", title: "Dislocation", q: ["dislocated", "joint popped out", "shoulder out of place", "dislocated finger", "joint out of socket"],
    a: [
      "Do not try to force the joint back in unless your protocol allows it.",
      "Support the limb in the position it is found and check circulation, sensation, and movement below the joint.",
      "Immobilise and apply cold packs if available.",
      "Transport and report the joint and any neurovascular changes."
    ] },

  { cat: "Injuries", title: "Head injury", q: ["head injury", "hit head", "concussion", "unconscious after fall", "check gcs", "pupils uneven", "head trauma", "bleeding from head"],
    a: [
      "Check the GCS and pupils, and record them.",
      "Protect the neck if the mechanism suggests spinal injury.",
      "Keep the airway open, and suction or position the patient as needed.",
      "Watch for worsening signs: falling GCS, repeated vomiting, unequal pupils, or seizures.",
      "Transport and report GCS trends."
    ] },

  { cat: "Injuries", title: "Spinal or neck injury", q: ["neck injury", "spinal injury", "c-spine", "car crash neck pain", "cant feel legs", "back injury after crash", "spine immobilisation", "neck pain after fall"],
    a: [
      "Keep the head and neck in line and avoid moving the patient unless there is danger.",
      "Apply a cervical collar and immobilise according to protocol.",
      "Check movement and feeling in all four limbs and record the findings.",
      "Transport on a spinal board or appropriate device, and report the findings."
    ] },

  { cat: "Injuries", title: "Chest trauma or collapsed lung", q: ["chest trauma", "collapsed lung", "pneumothorax", "tension pneumothorax", "stab to chest", "one side of chest not moving", "tracheal deviation", "chest injury breathing problem"],
    a: [
      "Listen to breath sounds on both sides of the chest.",
      "Look for absent breath sounds on one side, a tracheal shift, or swollen neck veins.",
      "If a tension pneumothorax is suspected, follow your protocol for decompression and report it immediately.",
      "Apply a chest seal to open chest wounds according to protocol.",
      "Give oxygen, assist breathing as needed, and transport immediately."
    ] },

  { cat: "Injuries", title: "Abdominal trauma", q: ["abdominal trauma", "stomach injury", "hit by car stomach", "internal bleeding", "belly injury", "pelvis injury"],
    a: [
      "Look for bruising, rigidity, swelling, or signs of shock.",
      "Control external bleeding and keep the patient still.",
      "Do not give food or drink. Protect against shock.",
      "Transport quickly to a trauma centre, since internal bleeding may be hidden."
    ] },

  { cat: "Injuries", title: "Fall from height", q: ["fell from height", "fell off roof", "fell from ladder", "fall injury", "fall from balcony"],
    a: [
      "Consider the height and landing surface, since these predict injuries.",
      "Assume spinal injury until ruled out and immobilise accordingly.",
      "Look for head, chest, abdominal, and pelvic injuries.",
      "Transport to a trauma centre and report the height of the fall."
    ] },

  { cat: "Injuries", title: "Road traffic crash", q: ["car crash", "road traffic accident", "crash with multiple cars", "hit by car", "motorcycle crash", "vehicle collision"],
    a: [
      "Check scene safety first, including traffic, fuel leaks, and fire risk.",
      "Assess the number of patients and the mechanism, such as speed and impact.",
      "Extricate only when the scene is safe, and immobilise the spine.",
      "Treat life threats first: airway, breathing, bleeding, and shock.",
      "Request extra units and report the number of patients to dispatch."
    ] },

  { cat: "Injuries", title: "Crush injury", q: ["crushed", "crush injury", "trapped under", "pinned under", "crushed leg", "crush syndrome"],
    a: [
      "Do not free a trapped patient until rescue teams are ready, since sudden release can cause shock.",
      "Once free, check circulation and treat for shock.",
      "Watch for dark urine or kidney problems, which can follow prolonged crush injury.",
      "Transport promptly."
    ] },

  { cat: "Injuries", title: "Electrical injury", q: ["electrocuted", "electric shock", "electrical injury", "touched power line", "lightning strike"],
    a: [
      "Do not touch the patient until the power source is switched off or the scene is confirmed safe.",
      "Check breathing and pulse. Electrical injury can stop the heart.",
      "Look for entry and exit burns.",
      "Transport, since internal damage can be present even if the patient seems fine."
    ] },

  { cat: "Injuries", title: "Eye injury", q: ["eye injury", "something in eye", "cut to eye", "chemical in eye", "eye hurts badly", "impaled object in eye"],
    a: [
      "Do not press on the eye or remove an object lodged in it.",
      "Cover both eyes lightly with dressings to limit movement.",
      "For chemicals, flush with clean water according to protocol.",
      "Transport and report the mechanism."
    ] },

  { cat: "Injuries", title: "Dog or animal bite", q: ["dog bite", "animal bite", "bitten by", "cat bite", "snake bite", "bitten by snake"],
    a: [
      "Check the bite for bleeding and puncture wounds, and control bleeding with pressure.",
      "Clean the area with clean water if possible and cover with a sterile dressing.",
      "For snake bites, keep the limb still and at about heart level, and avoid tourniquets or cutting the wound unless protocol says so.",
      "Monitor for allergic reaction or signs of spreading poison. Transport."
    ] },

  { cat: "Injuries", title: "Multiple patients and triage", q: ["multiple patients", "mass casualty", "triage", "many injured in crash", "how to triage", "several patients at scene", "more than one patient"],
    a: [
      "Request more units early and set up a staging area.",
      "Triage quickly: immediate (red), delayed (yellow), minor (green), and deceased or expectant (black).",
      "Treat life threats first: airway, major bleeding, and breathing.",
      "Label patients or assign a triage officer so no one is missed.",
      "Give each receiving hospital a count and status over radio."
    ] },

  // ================= ASSESSMENT =================
  { cat: "Assessment", title: "Scene safety and size-up", q: ["scene safety", "size up", "arriving on scene what first", "is the scene safe", "first thing on scene", "scene size up"],
    a: [
      "Before approaching, check for fire, smoke, gas, downed power lines, traffic, weapons, and unstable structures.",
      "Count the patients and estimate the mechanism of injury or nature of illness.",
      "Decide whether you need police, fire, or more ambulances.",
      "Do not enter an unsafe scene. Wait for law enforcement to clear it when required."
    ] },

  { cat: "Assessment", title: "Primary assessment (ABCDE)", q: ["primary assessment", "abcde", "how to assess patient", "first steps with patient", "what to check first", "airway breathing circulation", "primary survey"],
    a: [
      "A, Airway: check for obstruction and open it. Use a jaw thrust if spinal injury is possible. Insert an airway adjunct if appropriate.",
      "B, Breathing: check rate, depth, effort, and chest movement. Listen to the lungs. Assist with a BVM if breathing is inadequate.",
      "C, Circulation: check pulse, skin colour and temperature, and capillary refill. Control major bleeding first.",
      "D, Disability: check level of consciousness with AVPU or GCS, and check pupils and blood glucose if relevant.",
      "E, Expose and environment: expose enough to find injuries, and keep the patient warm and dignified."
    ] },

  { cat: "Assessment", title: "Secondary assessment (head to toe)", q: ["secondary assessment", "head to toe exam", "full body check", "detailed exam", "examine the patient"],
    a: [
      "Examine the head, face, neck, chest, abdomen, pelvis, arms, legs, and back.",
      "Look for deformity, tenderness, swelling, wounds, bruising, and rashes.",
      "Check neurological function and circulation in the limbs.",
      "Take a full set of vitals and repeat them regularly."
    ] },

  { cat: "Assessment", title: "SAMPLE history", q: ["sample history", "patient history", "what questions to ask patient", "medical history questions", "allergies and medications"],
    a: [
      "S: Signs and symptoms.",
      "A: Allergies.",
      "M: Medications, including prescriptions and recreational drugs.",
      "P: Past medical history.",
      "L: Last oral intake, such as food or drink.",
      "E: Events leading up to the call."
    ] },

  { cat: "Assessment", title: "OPQRST pain assessment", q: ["opqrst", "how to ask about pain", "pain assessment", "describe your pain", "pain scale"],
    a: [
      "O: Onset. When did it start, and what were you doing?",
      "P: Provocation or palliation. What makes it better or worse?",
      "Q: Quality. Sharp, dull, crushing, burning?",
      "R: Region and radiation. Where is it, and does it spread?",
      "S: Severity from 0 to 10.",
      "T: Time. How long has it lasted, and is it constant?"
    ] },

  { cat: "Assessment", title: "Normal vital signs", q: ["normal vitals", "vital signs ranges", "normal heart rate", "normal blood pressure", "normal oxygen level", "spo2 normal", "normal breathing rate", "what counts as normal"],
    a: [
      "Heart rate: about 60 to 100 beats per minute. Below 60 is bradycardia, above 100 is tachycardia.",
      "Respiratory rate: about 12 to 20 breaths per minute. Note depth and effort as well.",
      "Blood pressure: roughly 90/60 to 120/80 mmHg. Low values can suggest shock.",
      "SpO2: usually 95 to 100 percent. Lower values suggest low oxygen.",
      "Temperature: about 36.5 to 37.5 °C.",
      "Take vitals at the start, after treatment, and before transport."
    ] },

  { cat: "Assessment", title: "Paediatric vital signs", q: ["child vitals", "baby heart rate", "normal child heart rate", "infant breathing rate", "children normal vitals", "pediatric vitals"],
    a: [
      "Heart rate and breathing rate are higher in children and vary with age. Use your protocol's age tables.",
      "Infants typically breathe about 30 to 60 times per minute, and children about 20 to 30.",
      "Check the work of breathing: nasal flaring, retractions, and grunting are warning signs.",
      "Children can compensate for a long time, so watch for sudden deterioration."
    ] },

  { cat: "Assessment", title: "Glasgow Coma Scale (GCS)", q: ["gcs", "glasgow coma scale", "how to score consciousness", "level of consciousness", "how to check if patient is conscious", "gcs score meaning"],
    a: [
      "The GCS adds three scores for a total from 3 to 15.",
      "Eyes: 4 spontaneous, 3 to voice, 2 to pain, 1 none.",
      "Verbal: 5 oriented, 4 confused, 3 inappropriate words, 2 sounds only, 1 none.",
      "Motor: 6 obeys commands, 5 localises pain, 4 withdraws from pain, 3 abnormal flexion, 2 extension, 1 none.",
      "A total of 8 or lower is generally treated as a severe head injury and needs airway attention."
    ] },

  { cat: "Assessment", title: "AVPU", q: ["avpu", "quick consciousness check", "alert voice pain unresponsive", "is patient responsive"],
    a: [
      "A: Alert and oriented.",
      "V: Responds to Voice.",
      "P: Responds only to Pain.",
      "U: Unresponsive.",
      "AVPU is a quick alternative to the GCS when time is short."
    ] },

  { cat: "Assessment", title: "Pupil checks", q: ["pupils", "pupil size", "unequal pupils", "pupils not reacting", "pupil check", "dilated pupils"],
    a: [
      "Check size, shape, and whether the pupils are equal.",
      "Shine a light into each eye and check the response: both should constrict briskly.",
      "Unequal or fixed, dilated pupils can signal a serious head injury or brain problem.",
      "Record what you see at each reassessment."
    ] },

  { cat: "Assessment", title: "Blood glucose check", q: ["check blood sugar", "glucometer", "blood glucose test", "when to check glucose", "finger prick test"],
    a: [
      "Check glucose whenever a patient has altered mental status, seizures, weakness, or a known diabetes history.",
      "Clean the finger, prick it, and apply the blood to the strip as your device requires.",
      "Record the reading with the time.",
      "Treat or transport according to the result and protocol."
    ] },

  { cat: "Assessment", title: "Pain score and reassessment", q: ["pain score", "reassess patient", "how often to check", "after treatment check", "patient got better or worse"],
    a: [
      "Reassess after every intervention and every few minutes for unstable patients.",
      "Ask the patient to rate pain from 0 to 10 before and after treatment.",
      "Compare vitals, mental status, and any changes in the complaint.",
      "Document each reassessment with the time."
    ] },

  // ================= PROCEDURES =================
  { cat: "Procedures", title: "CPR (adult)", q: ["how to do cpr", "chest compressions", "cpr steps", "compressions and breaths", "hands only cpr", "compression rate"],
    a: [
      "Place the heel of one hand on the centre of the chest and the other hand on top.",
      "Push hard and fast, at about 100 to 120 compressions per minute, to a depth of about 5 to 6 cm for adults.",
      "Let the chest recoil fully between compressions.",
      "Give rescue breaths according to your protocol, such as 30 compressions to 2 breaths.",
      "Swap compressors every two minutes or sooner if tired, and minimise pauses."
    ] },

  { cat: "Procedures", title: "Recovery position", q: ["recovery position", "unconscious but breathing", "how to place patient on side", "side position", "patient breathing unconscious"],
    a: [
      "Kneel beside the patient and straighten their legs.",
      "Place the arm nearest you at a right angle with the palm up.",
      "Bring the far arm across the chest and hold the back of the hand against the cheek.",
      "Bend the far knee and roll the patient toward you onto their side.",
      "Tilt the head back slightly so the airway stays open, and check breathing regularly."
    ] },

  { cat: "Procedures", title: "Airway: head tilt, jaw thrust", q: ["open airway", "head tilt chin lift", "jaw thrust", "clear airway", "airway blocked by tongue", "how to open airway"],
    a: [
      "Head tilt, chin lift: tilt the head back and lift the chin. Use this if there is no spinal injury.",
      "Jaw thrust: place fingers behind the angle of the jaw and lift it forward without moving the head. Use this if spinal injury is possible.",
      "Clear visible obstructions with a suction device or by turning the patient, following protocol.",
      "Insert an oral or nasal airway if the patient allows it and it is in your protocol."
    ] },

  { cat: "Procedures", title: "BVM (bag-valve-mask) ventilation", q: ["how to use bvm", "bag valve mask use", "ventilate patient", "breathing for patient", "assisted breathing", "squeeze bag"],
    a: [
      "Seal the mask on the face with both hands, using a two-person technique if you can.",
      "Squeeze the bag steadily and watch the chest rise.",
      "Give each breath over about one second, and avoid squeezing too hard or fast, which can inflate the stomach.",
      "Watch the patient's colour and SpO2, and adjust the seal if the chest does not rise."
    ] },

  { cat: "Procedures", title: "Oxygen delivery", q: ["oxygen", "give oxygen", "nasal cannula", "non rebreather", "oxygen mask", "how much oxygen"],
    a: [
      "Nasal cannula: low-flow oxygen for patients who are breathing adequately.",
      "Non-rebreather mask: high-flow oxygen for patients who need more support, with the reservoir bag inflated.",

/* ============ MATCHING ENGINE ============ */
const SYN = [
  [/\bstop(ped|s|ping)? breathing\b/g, "not breathing"],
  [/\bno breath\b/g, "not breathing"],
  [/\bcan ?not breathe\b|\bcant breathe\b|\bcant breath\b|\bhard to breathe\b|\bdifficulty breathing\b/g, "short breath"],
  [/\bbreathe\b/g, "breath"],
  [/\bheart attack\b|\bchest hurts?\b|\bchest pressure\b|\bchest tight\w*/g, "chest pain"],
  [/\bpassed out\b|\bblack(ed)? out\b|\bblackout\b|\bdizzy\b/g, "faint"],
  [/\bfits?\b|\bconvuls\w*/g, "seizure"],
  [/\bblood sugar\b|\bsugar\b|\bdiabetes\b/g, "diabetic"],
  [/\bcut\b|\bstab\w*|\bshot\b|\bgunshot\b|\bblood loss\b|\bgushing\b|\bhemorrhag\w*|\bhaemorrhag\w*/g, "bleed"],
  [/\bbroke\w*|\bbroken\b|\bsnapped\b/g, "fracture"],
  [/\bdroop\w*|\bslurr\w*/g, "stroke"],
  [/\ballerg\w*|\bhives?\b|\bepipen\b|\bepinephrine\b/g, "allergic"],
  [/\bburnt\b/g, "burn"],
  [/\bwheez\w*/g, "wheez"],
  [/\bpoison\w*|\bod\b|\btoo many pills\b/g, "overdose"],
  [/\bchoke\w*/g, "choking"],
  [/\bcrushed\b/g, "crush"],
  [/\belectrocut\w*|\belectric shock\b/g, "electrical injury"],
  [/\bsugar is low\b/g, "low blood sugar"]
];

const STOP = new Set(["a","an","the","is","to","do","i","my","what","how","should","if","in","of","for","on","at","it","this","with","and","or","be","me","am","we","you","our","its","that","there","when","does","can","get","so","up","just","about","tell","which","where","who","his","her","their","they","he","she","was","are"]);

function norm(s) {
  let t = s.toLowerCase().replace(/['’]/g, "").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
  for (const [re, rep] of SYN) t = t.replace(re, rep);
  return t;
}

function stem(t) {
  if (t.length > 5 && t.endsWith("ing")) return t.slice(0, -3);
  if (t.length > 4 && t.endsWith("ed")) return t.slice(0, -2);
  if (t.length > 3 && t.endsWith("s") && !t.endsWith("ss")) return t.slice(0, -1);
  return t;
}

function toks(s) {
  return norm(s).split(" ").filter(t => t && !STOP.has(t)).map(stem);
}

function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

function tokSim(a, b) {
  if (a === b) return 1;
  const L = Math.min(a.length, b.length);
  const d = lev(a, b);
  if (L >= 8 && d <= 2) return 0.75;
  if (L >= 6 && d <= 1) return 0.8;
  return 0;
}

function sim(qt, pt) {
  if (!qt.length || !pt.length) return 0;
  let a = 0;
  for (const x of qt) {
    let best = 0;
    for (const y of pt) { const s = tokSim(x, y); if (s > best) best = s; if (best === 1) break; }
    a += best;
  }
  let b = 0;
  for (const y of pt) {
    let best = 0;
    for (const x of qt) { const s = tokSim(x, y); if (s > best) best = s; if (best === 1) break; }
    b += best;
  }
  return (a / qt.length + b / pt.length) / 2;
}

function scoreEntry(query, entry) {
  const qt = toks(query);
  const nq = " " + norm(query) + " ";
  let best = 0, matched = null;
  for (const phrase of [entry.title, ...entry.q]) {
    const np = norm(phrase);
    let s = sim(qt, toks(phrase));
    if (np && nq.includes(" " + np + " ")) s = Math.max(s, 1);
    if (s > best) { best = s; matched = phrase; }
  }
  return { score: best, matched };
}

function search(query) {
  if (!query.trim()) return [];
  return DB.map(e => ({ e, ...scoreEntry(query, e) }))
           .filter(r => r.score >= 0.35)
           .sort((a, b) => b.score - a.score);
}

/* ============ UI ============ */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = sel => document.querySelector(sel);
let activeCat = "All";

function body(a) {
  if (Array.isArray(a)) return `<ol>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ol>`;
  return `<p>${esc(a)}</p>`;
}

function entryCard(e, matched) {
  return `<article class="card">
    <span class="tag">${esc(e.cat)}</span>
    <h2>${esc(e.title)}</h2>
    ${body(e.a)}
    ${matched ? `<p class="muted">Matched: &ldquo;${esc(matched)}&rdquo;</p>` : ""}
  </article>`;
}

function renderResults(query) {
  const out = $("#results");
  $("#browse").classList.toggle("hidden", !!query.trim());
  if (!query.trim()) { out.innerHTML = `<div class="empty">Type something above, or pick a topic below.</div>`; return; }
  const found = search(query);
  if (!found.length) {
    out.innerHTML = `<div class="empty">Nothing matched &ldquo;${esc(query)}&rdquo;. Try other words or pick a topic.</div>`;
    return;
  }
  const [top, ...rest] = found;
  let html = entryCard(top.e, top.matched);
  const related = rest.slice(0, 5);
  if (related.length) {
    html += `<div class="section-label">Also check</div><div class="related">` +
      related.map(r => `<button class="pill" data-open="${DB.indexOf(r.e)}">${esc(r.e.title)}</button>`).join("") +
      `</div>`;
  }
  out.innerHTML = html;
}

function renderFilters() {
  const cats = ["All", ...new Set(DB.map(e => e.cat))];
  $("#filters").innerHTML = cats.map(c =>
    `<button class="pill" data-cat="${esc(c)}" aria-pressed="${c === activeCat}">${esc(c)}</button>`).join("");
}

function renderBrowse() {
  const list = DB.map((e, i) => ({ e, i })).filter(x => activeCat === "All" || x.e.cat === activeCat);
  $("#browse").innerHTML = `<div class="section-label">${activeCat === "All" ? "All topics" : esc(activeCat)} (${list.length})</div>` +
    list.map(({ e, i }) => `<div class="topic-row">
      <button data-open="${i}">${esc(e.title)}</button>
      <span class="muted">${esc(e.cat)}</span></div>`).join("");
}

document.addEventListener("click", e => {
  const cat = e.target.closest("[data-cat]");
  if (cat) {
    activeCat = cat.dataset.cat;
    renderFilters();
    renderBrowse();
    return;
  }
  const open = e.target.closest("[data-open]");
  if (open) {
    const entry = DB[Number(open.dataset.open)];
    $("#search").value = "";
    $("#results").innerHTML = entryCard(entry, null);
    $("#browse").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

$("#search").addEventListener("input", e => renderResults(e.target.value));

renderFilters();
renderBrowse();
renderResults("");

    <h2>Where is the problem?</h2>
    <p class="hint">Pick the closest one. You can change it later.</p>
    <div class="opts">${WHERE_OPTS.map((o, i) => `<button class="opt" data-where="${i}">${esc(o[0])}</button>`).join("")}</div>`;
}

function guideShowWhat(wi) {
  guideWhere = WHERE_OPTS[wi];
  $("#guide").innerHTML = `
    <h2>What is happening?</h2>
    <p class="hint">Location: ${esc(guideWhere[0])}</p>
    <div class="opts">${WHAT_OPTS.map((o, i) => `<button class="opt" data-what="${i}">${esc(o[0])}</button>`).join("")}</div>
    <button class="back-link" data-restart="1">&larr; Start over</button>`;
}

function guideShowResults(wi, xi) {
  const what = WHAT_OPTS[xi];
  const q = (WHERE_OPTS[wi][1] + " " + what[1]).trim() || what[0];
  const found = search(q);
  let html = `<h2>Results</h2><p class="hint">${esc(WHERE_OPTS[wi][0])} &middot; ${esc(what[0])}</p>`;
  if (!found.length) {
    html += `<p class="hint">Nothing matched that exactly. Try the search bar with a different word, or browse the topics below.</p>`;
  } else {
    const [top, ...rest] = found;
    html += `<article class="card" style="margin:10px 0 0">
      <span class="tag">${esc(top.e.cat)}</span>
      <h2>${esc(top.e.title)}</h2>
      ${Array.isArray(top.e.a) ? `<ol>${top.e.a.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : `<p>${esc(top.e.a)}</p>`}
    </article>`;
    if (rest.length) {
      html += `<div class="opts">${rest.slice(0, 5).map(r => `<button class="opt" data-open="${DB.indexOf(r.e)}">${esc(r.e.title)}</button>`).join("")}</div>`;
    }
  }
  html += `<button class="back-link" data-restart="1">&larr; Start over</button>`;
  $("#guide").innerHTML = html;
}

document.getElementById("guide-open").addEventListener("click", () => {
  if (!$("#guide").classList.contains("hidden")) { $("#guide").classList.add("hidden"); return; }
  guideShowWhere();
});

$("#guide").addEventListener("click", e => {
  const w = e.target.closest("[data-where]");
  if (w) { guideShowWhat(Number(w.dataset.where)); return; }
  const x = e.target.closest("[data-what]");
  if (x && guideWhere) { guideShowResults(WHERE_OPTS.indexOf(guideWhere), Number(x.dataset.what)); return; }
  if (e.target.closest("[data-restart]")) { guideShowWhere(); }
});
</script>
</body>
</html>
